<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Widget - Practice</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            width: 350px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        /* TODO: Add hover effect to the whole card later? */
        /* .card:hover { transform: translateY(-2px); } */

        h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .rating-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .btn-rating {
            background: #334155;
            border: none;
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-rating:hover {
            background-color: var(--accent);
            transform: scale(1.1);
        }

        .btn-rating.active {
            background-color: #4f46e5;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #4f46e5;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .thank-you-state {
            display: none;
        }

        .thank-you-state.show {
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="feedback-card">
        <!-- Rating State -->
        <div id="rating-state">
            <h3>How did we do?</h3>
            <p>Please let us know how we did with your support request. All feedback helps us improve!</p>
            
            <!-- TODO: Add ARIA labels for accessibility -->
            <div class="rating-container">
                <button class="btn-rating" data-val="1">1</button>
                <button class="btn-rating" data-val="2">2</button>
                <button class="btn-rating" data-val="3">3</button>
                <button class="btn-rating" data-val="4">4</button>
                <button class="btn-rating" data-val="5">5</button>
            </div>

            <button class="btn-submit" id="submit-btn" disabled>Submit Feedback</button>
        </div>

        <!-- Success State -->
        <div id="success-state" class="thank-you-state">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
            <h3>Thank you!</h3>
            <p>We appreciated you taking the time to give a rating of <span id="selected-rating-display" style="color: #a5b4fc; font-weight: bold;">0</span> out of 5.</p>
        </div>
    </div>

    <script>
        const ratingButtons = document.querySelectorAll('.btn-rating');
        const submitBtn = document.getElementById('submit-btn');
        const ratingState = document.getElementById('rating-state');
        const successState = document.getElementById('success-state');
        const ratingDisplay = document.getElementById('selected-rating-display');

        let selectedRating = null;

        ratingButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                // Quick hack to clear previous active states
                // FIXME: Is there a cleaner way to do this without looping every time?
                ratingButtons.forEach(btn => btn.classList.remove('active'));

                button.classList.add('active');
                selectedRating = button.getAttribute('data-val');
                
                // console.log('Selected rating:', selectedRating); // debug line
                
                submitBtn.removeAttribute('disabled');
            });
        });

        submitBtn.addEventListener('click', () => {
            if (!selectedRating) return; // Guard clause

            ratingDisplay.textContent = selectedRating;
            
            // Transition states
            ratingState.classList.add('hidden');
            successState.classList.add('show');
        });
    </script>
</body>
</html>
