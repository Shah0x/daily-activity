<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Dialog Playground</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --text: #111827;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: grid;
            place-content: center;
            height: 100vh;
            margin: 0;
        }

        /* TODO: Research smoother entry transition workaround. 
           Native <dialog> display change from none to block messes up raw transitions. */
        dialog {
            border: none;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: none; /* fallback */
        }

        dialog[open] {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        dialog::backdrop {
            background-color: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px); /* Warning: high GPU usage on low-end mobile */
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>

    <button id="open-modal" class="btn">Open Config Dialog</button>

    <dialog id="config-dialog">
        <h3 style="margin-top: 0; font-size: 1.25rem;">Confirm Sync Changes</h3>
        <p style="color: #4b5563; font-size: 0.95rem; line-height: 1.5;">
            This will overwrite your local configuration with the remote Git repository data. This cannot be undone.
        </p>
        
        <div class="actions">
            <button id="close-modal" class="btn btn-secondary">Cancel</button>
            <button id="confirm-action" class="btn">Sync Now</button>
        </div>
    </dialog>

    <script>
        const dialog = document.getElementById('config-dialog');
        const openBtn = document.getElementById('open-modal');
        const closeBtn = document.getElementById('close-modal');
        const confirmBtn = document.getElementById('confirm-action');

        openBtn.addEventListener('click', () => {
            // console.log('Opening native modal...'); // debug-log
            dialog.showModal();
        });

        closeBtn.addEventListener('click', () => {
            dialog.close();
        });

        // Close on backdrop click (standard UX request)
        dialog.addEventListener('click', (e) => {
            const rect = dialog.getBoundingClientRect();
            const isInDialog = (
                rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
                rect.left <= e.clientX && e.clientX <= rect.left + rect.width
            );
            if (!isInDialog) {
                // console.log('Clicked outside dialog container. Closing.');
                dialog.close();
            }
        });

        confirmBtn.addEventListener('click', () => {
            // TODO: dispatch real sync state change event to state store
            alert('Initiating background sync task...');
            dialog.close();
        });
    </script>
</body>
</html>
